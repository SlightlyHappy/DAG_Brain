<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#131c31" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="edgeEmp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <style>
      .pulse-edge {
        stroke-dasharray: 8 5;
        animation: dashFlow 18s linear infinite;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -300; }
      }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#26334d" stroke-width="2" />

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(148, 163, 184, 0.06)" stroke-width="1">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
    <line x1="650" y1="0" x2="650" y2="380" stroke-dasharray="4 4" stroke="rgba(148, 163, 184, 0.14)" />
    <line x1="830" y1="0" x2="830" y2="380" stroke-dasharray="4 4" stroke="rgba(148, 163, 184, 0.14)" />
    <line x1="1010" y1="0" x2="1010" y2="380" stroke-dasharray="4 4" stroke="rgba(148, 163, 184, 0.14)" />
  </g>

  <!-- Left Content: Brand & Value Proposition -->
  <g transform="translate(48, 52)" class="font-sans">
    <!-- Top Pill -->
    <rect x="0" y="0" width="380" height="28" rx="14" fill="rgba(59, 130, 246, 0.14)" stroke="rgba(59, 130, 246, 0.4)" />
    <text x="16" y="18" fill="#93c5fd" font-size="11.5" font-weight="700" letter-spacing="0.04em">
      OPEN-SOURCE • SELF-HOSTED • BY SLIGHTLYHAPPY
    </text>

    <!-- Main Title -->
    <text x="0" y="82" fill="url(#titleGrad)" font-size="50" font-weight="800" letter-spacing="-0.02em">
      DAG_Brain
    </text>
    <text x="275" y="82" fill="#64748b" font-size="24" font-weight="600">
      / Causal Studio
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" fill="#e2e8f0" font-size="18.5" font-weight="600">
      Where Socratic AI Research Meets Pearlian Causal Mathematics.
    </text>
    <text x="0" y="152" fill="#94a3b8" font-size="14">
      The missing bridge between DAGitty's d-separation rigor, NotebookLM's
    </text>
    <text x="0" y="172" fill="#94a3b8" font-size="14">
      citation-grounded synthesis, and multi-agent methodological critique.
    </text>

    <!-- 3 Feature Pills -->
    <g transform="translate(0, 202)">
      <rect x="0" y="0" width="175" height="58" rx="10" fill="#131d31" stroke="#10b981" stroke-width="1.4" />
      <text x="14" y="22" fill="#34d399" font-size="12" font-weight="700">🧮 DAGitty Math Engine</text>
      <text x="14" y="40" fill="#94a3b8" font-size="10.5">Exact d-separation, IVs,</text>
      <text x="14" y="52" fill="#94a3b8" font-size="10.5">&amp; collider trap alerts</text>

      <rect x="188" y="0" width="185" height="58" rx="10" fill="#131d31" stroke="#3b82f6" stroke-width="1.4" />
      <text x="202" y="22" fill="#60a5fa" font-size="12" font-weight="700">📚 NotebookLM Vault</text>
      <text x="202" y="40" fill="#94a3b8" font-size="10.5">OpenAlex/Crossref RAG +</text>
      <text x="202" y="52" fill="#94a3b8" font-size="10.5">APA / AMA / BibTeX cites</text>

      <rect x="386" y="0" width="185" height="58" rx="10" fill="#131d31" stroke="#a855f7" stroke-width="1.4" />
      <text x="400" y="22" fill="#c084fc" font-size="12" font-weight="700">🧠 Socratic Co-Pilot</text>
      <text x="400" y="40" fill="#94a3b8" font-size="10.5">OpenRouter • Ollama •</text>
      <text x="400" y="52" fill="#94a3b8" font-size="10.5">Reviewer #2 Critic Mode</text>
    </g>
  </g>

  <!-- Right Graphic: Animated Interactive Causal DAG Preview -->
  <g transform="translate(640, 26)" class="font-sans">
    <!-- Temporal Wave Headers -->
    <text x="65" y="18" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">t₀: CONFOUNDERS / IV</text>
    <text x="225" y="18" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">t₁: EXPOSURE</text>
    <text x="365" y="18" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">t₂: MEDIATOR</text>
    <text x="485" y="18" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">t₃: OUTCOME</text>

    <!-- Edges -->
    <!-- Confounder -> Exposure -->
    <path d="M 125 78 Q 165 110 190 155" fill="none" stroke="#10b981" stroke-width="2.4" marker-end="url(#arrGreen)" />
    <!-- Confounder -> Outcome (Blocked Backdoor) -->
    <path d="M 135 65 Q 310 35 455 152" fill="none" stroke="#3b82f6" stroke-width="2" class="pulse-edge" marker-end="url(#arrBlue)" />
    <rect x="255" y="38" width="108" height="18" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="309" y="50" fill="#93c5fd" font-size="9" font-weight="700" text-anchor="middle">BLOCKED BY [Z]</text>

    <!-- IV -> Exposure -->
    <path d="M 125 180 L 168 180" fill="none" stroke="#10b981" stroke-width="2.4" marker-end="url(#arrGreen)" />

    <!-- Exposure -> Mediator -->
    <path d="M 282 180 L 315 180" fill="none" stroke="#10b981" stroke-width="2.8" marker-end="url(#arrGreen)" />
    <text x="298" y="172" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">[2 refs]</text>

    <!-- Mediator -> Outcome -->
    <path d="M 415 180 L 442 180" fill="none" stroke="#10b981" stroke-width="2.8" marker-end="url(#arrGreen)" />

    <!-- Exposure -> Collider & Outcome -> Collider -->
    <path d="M 235 206 Q 280 265 320 285" fill="none" stroke="#a855f7" stroke-width="1.8" class="pulse-edge" marker-end="url(#arrPurple)" />
    <path d="M 475 206 Q 445 265 410 285" fill="none" stroke="#a855f7" stroke-width="1.8" class="pulse-edge" marker-end="url(#arrPurple)" />

    <!-- Node 1: Confounder (Adjusted) -->
    <g transform="translate(10, 44)">
      <rect width="125" height="48" rx="8" fill="#4c0519" stroke="#f8fafc" stroke-width="2.2" />
      <text x="8" y="14" fill="#fda4af" font-size="8" font-weight="700">CONFOUNDER</text>
      <text x="117" y="14" fill="#ffffff" font-size="8" font-weight="800" text-anchor="end">[Z]</text>
      <text x="62" y="33" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle">Baseline Stress</text>
    </g>

    <!-- Node 2: Instrument (IV) -->
    <g transform="translate(10, 156)">
      <rect width="115" height="48" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="2" />
      <text x="8" y="14" fill="#67e8f9" font-size="8" font-weight="700">INSTRUMENT (IV)</text>
      <text x="57" y="33" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle">Circadian PRS</text>
    </g>

    <!-- Node 3: Exposure (X) -->
    <g transform="translate(172, 156)">
      <rect width="110" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.4" filter="url(#glow)" />
      <text x="8" y="14" fill="#6ee7b7" font-size="8" font-weight="700">EXPOSURE (X)</text>
      <text x="55" y="33" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Sleep Loss</text>
    </g>

    <!-- Node 4: Mediator (M) -->
    <g transform="translate(318, 156)">
      <rect width="98" height="48" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
      <text x="8" y="14" fill="#fcd34d" font-size="8" font-weight="700">MEDIATOR</text>
      <text x="49" y="33" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Exec Fatigue</text>
    </g>

    <!-- Node 5: Outcome (Y) -->
    <g transform="translate(445, 156)">
      <rect width="95" height="48" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.4" filter="url(#glow)" />
      <text x="8" y="14" fill="#93c5fd" font-size="8" font-weight="700">OUTCOME (Y)</text>
      <text x="47" y="33" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Cognition</text>
    </g>

    <!-- Node 6: Collider Trap -->
    <g transform="translate(310, 266)">
      <rect width="115" height="46" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="2" />
      <text x="8" y="14" fill="#d8b4fe" font-size="8" font-weight="700">COLLIDER TRAP</text>
      <text x="57" y="32" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Clinic Visit</text>
    </g>
  </g>
</svg>
