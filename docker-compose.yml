services:
  dag-brain:
    build: .
    container_name: dag-brain
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - dag_brain_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=/app/data/dag_brain.sqlite
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional bundled Ollama container (run with: docker compose --profile local-ai up -d)
  ollama:
    image: ollama/ollama:latest
    container_name: dag-brain-ollama
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  dag_brain_data:
  ollama_models:
