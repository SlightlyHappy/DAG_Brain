[project]
name = "dag-brain"
version = "0.4.0"
description = "DAG Brain by SlightlyHappy: a self-hosted workspace for causal diagrams you can defend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "SlightlyHappy" }]
maintainers = [{ name = "SlightlyHappy" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
dag-brain = "backend.main:run"

[project.urls]
Homepage = "https://github.com/SlightlyHappy/DAG_Brain"
Source = "https://github.com/SlightlyHappy/DAG_Brain"
Issues = "https://github.com/SlightlyHappy/DAG_Brain/issues"
